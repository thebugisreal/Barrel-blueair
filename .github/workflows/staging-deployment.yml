name: Staging Deployment

on:
  push:
    branches: [ 'release/**' ]
  workflow_dispatch:
    inputs:
      release_branch:
        description: 'Release branch name (e.g., release/v1.2.3)'
        required: true
        type: string

jobs:
  deploy-to-staging:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        store: [us, eu, uk]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Setup Git
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'

      - name: Get release branch name
        id: release
        run: |
          if [ "${{ github.event.inputs.release_branch }}" != "" ]; then
            echo "branch=${{ github.event.inputs.release_branch }}" >> $GITHUB_OUTPUT
          else
            echo "branch=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Reset staging to live
        run: |
          git checkout staging/${{ matrix.store }}
          git reset --hard origin/live/${{ matrix.store }}

      - name: Merge release to staging
        run: |
          git merge ${{ steps.release.outputs.branch }} --no-edit

      - name: Build assets
        run: |
          echo "🔨 Building assets (Tailwind JIT scans liquid files for class usage)..."
          npm run build

      - name: Commit changes
        run: |
          git add -A
          git commit -m "Auto-deploy from ${{ steps.release.outputs.branch }}: Build assets for staging" || echo "No changes to commit"

      - name: Push to staging branch
        run: git push origin staging/${{ matrix.store }} --force-with-lease