name: Staging Deployment

on:
  push:
    branches: [ 'release/**' ]
  workflow_dispatch:
    inputs:
      release_branch:
        description: 'Release branch name (e.g., release/v1.2.3)'
        required: true
        type: string

jobs:
  deploy-to-staging:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        store: [us, eu, uk]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Setup Git
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'

      - name: Get release branch name
        id: release
        run: |
          if [ "${{ github.event.inputs.release_branch }}" != "" ]; then
            echo "branch=${{ github.event.inputs.release_branch }}" >> $GITHUB_OUTPUT
          else
            echo "branch=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Reset staging to live
        run: |
          git checkout staging/${{ matrix.store }}
          git reset --hard origin/live/${{ matrix.store }}

      - name: Merge release to staging
        run: |
          git merge ${{ steps.release.outputs.branch }} --no-edit

      - name: Check if src files changed
        id: check_src
        run: |
          echo "🔍 Checking for changes in src/ folder across all pushed commits..."

          # Use the commit range from the push event to release branch
          # This captures ALL commits in the push, not just the last one
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"

          echo "Comparing commits: $BEFORE...$AFTER"

          # Check if src/ files changed in the entire push range
          CHANGED_FILES=$(git diff --name-only $BEFORE $AFTER 2>/dev/null || echo "")
          SRC_CHANGED=$(echo "$CHANGED_FILES" | grep -E '^src/' || echo "")

          if [ -n "$SRC_CHANGED" ]; then
            echo "✅ Source files changed in push:"
            echo "$SRC_CHANGED"
            echo "needs_build=true" >> $GITHUB_OUTPUT
          else
            echo "ℹ️  No source files changed - skipping build"
            echo "needs_build=false" >> $GITHUB_OUTPUT
          fi

      - name: Build assets
        if: steps.check_src.outputs.needs_build == 'true'
        run: |
          echo "🔨 Building assets..."
          npm run build

      - name: Commit changes
        run: |
          git add -A
          if [ "${{ steps.check_src.outputs.needs_build }}" == "true" ]; then
            git commit -m "Auto-deploy from ${{ steps.release.outputs.branch }}: Build assets for staging" || echo "No changes to commit"
          else
            git commit -m "Auto-deploy from ${{ steps.release.outputs.branch }}: Sync changes (no asset rebuild needed)" || echo "No changes to commit"
          fi

      - name: Push to staging branch
        run: git push origin staging/${{ matrix.store }} --force-with-lease