name: Production Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Setup Git
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'

      - name: Check if src files changed
        id: check_src
        run: |
          echo "🔍 Checking for changes in src/ folder across all pushed commits..."

          # Use the commit range from the push event
          # This captures ALL commits in the push, not just the last one
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"

          echo "Comparing commits: $BEFORE...$AFTER"

          # Check if src/ files changed in the entire push range
          CHANGED_FILES=$(git diff --name-only $BEFORE $AFTER 2>/dev/null || echo "")
          SRC_CHANGED=$(echo "$CHANGED_FILES" | grep -E '^src/' || echo "")

          if [ -n "$SRC_CHANGED" ]; then
            echo "✅ Source files changed in push:"
            echo "$SRC_CHANGED"
            echo "needs_build=true" >> $GITHUB_OUTPUT
          else
            echo "ℹ️  No source files changed - skipping build"
            echo "needs_build=false" >> $GITHUB_OUTPUT
          fi

      - name: Build assets
        if: steps.check_src.outputs.needs_build == 'true'
        run: |
          echo "🔨 Building assets..."
          npm run build

      - name: Commit built assets to main
        if: steps.check_src.outputs.needs_build == 'true'
        run: |
          git add -A
          git commit -m "Auto-build: Build assets for production" || echo "No changes to commit"

      - name: Push to main
        run: git push origin main

  merge-main-to-live:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    strategy:
      matrix:
        store: [us, eu, uk]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'

      - name: Merge main to live branch
        run: |
          git checkout -b live/${{ matrix.store }} origin/live/${{ matrix.store }}
          git merge origin/main --no-edit

      - name: Push updated live branch
        run: git push origin live/${{ matrix.store }}