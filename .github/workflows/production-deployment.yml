name: Production Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Setup Git
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'

      - name: Build assets
        run: |
          echo "🔨 Building assets (Tailwind JIT scans liquid files for class usage)..."
          npm run build

      - name: Commit built assets to main
        run: |
          git add -A
          git commit -m "Auto-build: Build assets for production" || echo "No changes to commit"

      - name: Push to main
        run: |
          echo "📤 Pushing build assets to main..."
          git push origin main

  merge-main-to-live:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    strategy:
      matrix:
        store: [us, eu, uk]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'

      - name: Fetch latest main branch
        run: |
          echo "🔄 Fetching latest main branch (including build commit)..."
          git fetch origin main
          git log origin/main -3 --oneline
          echo "✅ Latest main branch fetched"

      - name: Merge main to live branch
        run: |
          git checkout -b live/${{ matrix.store }} origin/live/${{ matrix.store }}
          git merge origin/main --no-edit

      - name: Push updated live branch
        run: git push origin live/${{ matrix.store }}